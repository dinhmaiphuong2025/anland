name: Build Niri Anland Backend

on:
  push:
    paths:
      - 'producers/niri/**'
  pull_request:
    paths:
      - 'producers/niri/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build-type: [cross, native-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        if: matrix.build-type == 'cross'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.87
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install native build deps (for native-check)
        if: matrix.build-type == 'native-check'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libgbm-dev libegl1-mesa-dev \
            libgles2-mesa-dev libinput-dev libseat-dev libudev-dev libdrm-dev \
            libpipewire-0.3-dev libpango1.0-dev libxkbcommon-dev \
            libdisplay-info-dev

      - name: Build anland-sys (check)
        run: |
          cd producers/niri/anland-sys
          cargo check

      - name: Cross-compile niri
        if: matrix.build-type == 'cross'
        run: |
          cd producers/niri
          bash build.sh
        env:
          JOBS: 2

      - name: Native build check (x86_64)
        if: matrix.build-type == 'native-check'
        run: |
          cd producers/niri
          bash build.sh --native || true
        env:
          JOBS: 2

      - name: Upload artifact
        if: matrix.build-type == 'cross'
        uses: actions/upload-artifact@v4
        with:
          name: niri-anland-aarch64
          path: producers/niri/output/