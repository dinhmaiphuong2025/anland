name: Build Anland Consumer APK

on:
  push:
    paths:
      - 'consumers/anland_v5/android_consumer/**'
      - '.github/workflows/build-consumer.yml'
  pull_request:
    paths:
      - 'consumers/anland_v5/android_consumer/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || echo "no cmdline-tools"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" \
                        "build-tools;36.0.0" \
                        "ndk;29.0.13113456" \
                        "cmake;3.22.1" || true

      - name: Verify SDK layout
        run: |
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Build release APK
        working-directory: consumers/anland_v5/android_consumer
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anland-consumer-apk
          path: consumers/anland_v5/android_consumer/app/build/outputs/apk/release/*.apk